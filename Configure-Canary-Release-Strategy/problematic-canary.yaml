apiVersion: v1
kind: ConfigMap
metadata:
  name: problematic-canary-content
  namespace: canary-demo
data:
  broken.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Product Service - Problematic Version</title></head>
    <body>
        <h1>Product Service</h1>
        <h2>Version: Problematic v2.1</h2>
        <div style="background-color: red; color: white; padding: 10px;">
            Status: ERROR - This version is problematic
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-problematic
  namespace: canary-demo
  labels:
    app: product-service
    version: problematic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
      version: problematic
  template:
    metadata:
      labels:
        app: product-service
        version: problematic
    spec:
      containers:
      - name: product-service
        image: nginx:1.21
        ports:
        - containerPort: 80
        env:
        - name: VERSION
          value: "problematic-v2.1"
        volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html
        # index.html is intentionally not provided by this ConfigMap,
        # so nginx returns HTTP 404 on the default path, simulating a
        # broken canary release.
      volumes:
      - name: html-content
        configMap:
          name: problematic-canary-content
