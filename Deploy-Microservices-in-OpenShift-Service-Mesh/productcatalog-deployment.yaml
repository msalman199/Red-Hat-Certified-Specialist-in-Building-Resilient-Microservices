apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalog
  labels:
    app: productcatalog
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalog
      version: v1
  template:
    metadata:
      labels:
        app: productcatalog
        version: v1
    spec:
      containers:
      - name: productcatalog
        image: quay.io/redhattraining/ossm-productcatalog:1.0
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalog
  labels:
    app: productcatalog
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: productcatalog
