apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-percentage-fault
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  - fault:
      delay:
        percentage:
          value: 50.0
        fixedDelay: 3s
      abort:
        percentage:
          value: 10.0
        httpStatus: 503
    route:
    - destination:
        host: reviews
        subset: v1
