apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-retry
  namespace: bookinfo
spec:
  hosts:
  - reviews
  http:
  - fault:
      abort:
        percentage:
          value: 50.0
        httpStatus: 503
    route:
    - destination:
        host: reviews
        subset: v1
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
