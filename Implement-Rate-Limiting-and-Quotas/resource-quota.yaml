apiVersion: v1
kind: ResourceQuota
metadata:
  name: rate-limiting-quota
  namespace: rate-limiting-lab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
    services: "5"
    persistentvolumeclaims: "2"
    count/deployments.apps: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rate-limiting-limits
  namespace: rate-limiting-lab
spec:
  limits:
  - default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "1"
      memory: "1Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container
