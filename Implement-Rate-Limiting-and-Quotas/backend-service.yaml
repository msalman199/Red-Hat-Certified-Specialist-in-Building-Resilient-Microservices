apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
  namespace: rate-limiting-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-service
      version: v1
  template:
    metadata:
      labels:
        app: backend-service
        version: v1
    spec:
      containers:
      - name: backend
        image: httpd:2.4
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: rate-limiting-lab
spec:
  selector:
    app: backend-service
  ports:
  - port: 80
    targetPort: 80
    name: http
