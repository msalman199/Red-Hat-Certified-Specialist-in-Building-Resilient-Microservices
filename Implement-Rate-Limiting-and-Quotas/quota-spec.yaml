apiVersion: config.istio.io/v1alpha2
kind: QuotaSpec
metadata:
  name: request-count
  namespace: rate-limiting-lab
spec:
  rules:
  - quotas:
    - charge: 1
      quota: requestcount
---
apiVersion: config.istio.io/v1alpha2
kind: QuotaSpecBinding
metadata:
  name: request-count
  namespace: rate-limiting-lab
spec:
  quotaSpecs:
  - name: request-count
    namespace: rate-limiting-lab
  services:
  - name: backend-service
    namespace: rate-limiting-lab
