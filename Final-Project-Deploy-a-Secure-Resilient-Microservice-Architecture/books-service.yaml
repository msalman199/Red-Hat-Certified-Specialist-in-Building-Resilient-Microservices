apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-service
  namespace: bookstore-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-service
      version: v1
  template:
    metadata:
      labels:
        app: books-service
        version: v1
    spec:
      containers:
      - name: books-service
        image: quay.io/redhat-training/books-service:1.0
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://bookuser:bookpass123@database:5432/bookstore"
        - name: SERVICE_NAME
          value: "books-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: books-service
  namespace: bookstore-app
  labels:
    app: books-service
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: books-service
