apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-destination-rule
  namespace: bookstore-app
spec:
  host: reviews-service
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-vs
  namespace: bookstore-app
spec:
  hosts:
  - reviews-service
  http:
  - match:
    - headers:
        user-type:
          exact: premium
    route:
    - destination:
        host: reviews-service
        subset: v2
      weight: 100
  - route:
    - destination:
        host: reviews-service
        subset: v1
      weight: 80
    - destination:
        host: reviews-service
        subset: v2
      weight: 20
