apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-dashboard
  namespace: istio-system
  labels:
    grafana_dashboard: "1"
data:
  bookstore-dashboard.json: |
    {
      "dashboard": {
        "title": "Bookstore Application Metrics",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_name=~\"books-service|reviews-service|frontend\"}[5m])) by (destination_service_name)"
              }
            ]
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service_name=~\"books-service|reviews-service|frontend\",response_code!~\"2..\"}[5m])) by (destination_service_name)"
              }
            ]
          }
        ]
      }
    }
