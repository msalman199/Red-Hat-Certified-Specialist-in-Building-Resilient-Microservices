apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: bookstore-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load-generator
        image: busybox
        command: ["/bin/sh"]
        args: ["-c", "while true; do wget -q -O- http://frontend:8080/; sleep 1; done"]
