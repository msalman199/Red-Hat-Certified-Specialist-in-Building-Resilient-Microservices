apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-service-v1
  namespace: bookstore-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-service
      version: v1
  template:
    metadata:
      labels:
        app: reviews-service
        version: v1
    spec:
      containers:
      - name: reviews-service
        image: quay.io/redhat-training/reviews-service:1.0
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_VERSION
          value: "v1"
        - name: STAR_COLOR
          value: "black"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-service-v2
  namespace: bookstore-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-service
      version: v2
  template:
    metadata:
      labels:
        app: reviews-service
        version: v2
    spec:
      containers:
      - name: reviews-service
        image: quay.io/redhat-training/reviews-service:2.0
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_VERSION
          value: "v2"
        - name: STAR_COLOR
          value: "red"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: bookstore-app
  labels:
    app: reviews-service
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: reviews-service
