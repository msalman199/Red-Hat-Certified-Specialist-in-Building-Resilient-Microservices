version: '3.8'

services:
  production-app:
    image: nginx:alpine
    container_name: production-app
    ports:
      - "8080:80"
    volumes:
      - ./production:/usr/share/nginx/html
      - ./config/production-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  staging-app:
    image: nginx:alpine
    container_name: staging-app
    ports:
      - "8081:80"
    volumes:
      - ./staging:/usr/share/nginx/html
      - ./config/staging-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  traffic-mirror:
    build:
      context: ./config
      dockerfile: Dockerfile.mirror
    container_name: traffic-mirror
    ports:
      - "8000:8000"
    depends_on:
      - production-app
      - staging-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
