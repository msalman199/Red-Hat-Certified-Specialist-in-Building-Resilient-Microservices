apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: httpbin
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: bookinfo
spec:
  selector:
    app: httpbin
  ports:
  - port: 8000
    targetPort: 80
