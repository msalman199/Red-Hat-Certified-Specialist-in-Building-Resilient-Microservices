apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: egress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        image: curlimages/curl:latest
        command: ["/bin/sh"]
        args: ["-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: egress-lab
spec:
  selector:
    app: sample-app
  ports:
  - port: 80
    targetPort: 80
