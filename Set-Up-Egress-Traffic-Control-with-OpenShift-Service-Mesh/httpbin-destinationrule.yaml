apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: httpbin-ext
  namespace: egress-lab
spec:
  host: httpbin.org
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
    circuitBreaker:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
