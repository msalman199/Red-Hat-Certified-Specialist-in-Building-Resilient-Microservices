apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-demo-app
  namespace: health-probe-lab
  labels:
    app: health-demo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-demo
      version: v1
  template:
    metadata:
      labels:
        app: health-demo
        version: v1
    spec:
      containers:
      - name: health-demo
        image: quay.io/redhattraining/health-probe-demo:latest
        ports:
        - containerPort: 8080
        env:
        - name: STARTUP_DELAY
          value: "10"
        - name: READINESS_DELAY
          value: "5"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: health-demo-service
  namespace: health-probe-lab
  labels:
    app: health-demo
spec:
  selector:
    app: health-demo
  ports:
  - port: 8080
    targetPort: 8080
    name: http
