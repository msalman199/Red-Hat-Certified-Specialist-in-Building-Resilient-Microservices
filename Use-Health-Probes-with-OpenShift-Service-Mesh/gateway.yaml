apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: health-demo-gateway
  namespace: health-probe-lab
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - health-demo.apps.cluster.local
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: health-demo-gateway-vs
  namespace: health-probe-lab
spec:
  hosts:
  - health-demo.apps.cluster.local
  gateways:
  - health-demo-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: health-demo-service
        port:
          number: 8080
