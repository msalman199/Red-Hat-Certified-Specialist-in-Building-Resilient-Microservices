apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-demo-app
  namespace: health-probe-lab
  labels:
    app: health-demo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-demo
      version: v1
  template:
    metadata:
      labels:
        app: health-demo
        version: v1
    spec:
      containers:
      - name: health-demo
        image: quay.io/redhattraining/health-probe-demo:latest
        ports:
        - containerPort: 8080
        env:
        - name: STARTUP_DELAY
          value: "10"
        - name: READINESS_DELAY
          value: "5"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
